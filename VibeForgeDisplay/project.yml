name: VibeForgeDisplay
options:
  bundleIdPrefix: com.vibeforge
  deploymentTarget:
    macOS: "14.0"
    tvOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

# Shared build settings. Target-specific values (Info.plist, bundle id,
# platform deployment, Swift version) live on each target so they don't leak
# across the macOS and tvOS targets.
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  # macOS sender app
  VibeForgeDisplay:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_NAME: VibeForge Display
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeforge.display
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/VibeForgeDisplay-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"

  # tvOS receiver app (native HLS player for Apple TV)
  VibeForgeReceiver:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: ../VibeForgeReceiver/Sources
    settings:
      base:
        # Swift 5 mode: the receiver uses NetService delegate APIs that are
        # noisy under Swift 6 strict concurrency; keep this small target simple.
        SWIFT_VERSION: "5.0"
        TVOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_NAME: VibeForge Receiver
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeforge.display.receiver
        INFOPLIST_FILE: ../VibeForgeReceiver/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
